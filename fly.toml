app = "shooter3d"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 2000
    soft_limit = 1000

  [http_service.checks]
    [http_service.checks.healthcheck]
      interval = "15s"
      timeout = "10s"
      grace_period = "60s"
      method = "GET"
      path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512